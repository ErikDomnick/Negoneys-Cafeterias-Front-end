<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Negoney's Cafeterias</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body class="body-normal">
        <header>
            <h1>Negoney's Cafeterias</h1>
            <p id="frase-motivacional-do-negoneyson"><em>Nossos produtos, seu sorriso</em></p>
            <nav>
                <a href="cardapio.html" id="btncardapio" class="btnnav">Cardápio</a>
                <a href="sobre.html" id="btnsobre" class="btnnav">Sobre</a>
                <a href="reservas.html" id="btnreservas" class="btnnav">Reservas</a>
            </nav>
        </header>
        <main>
            <section id="reservas" class="secoes">
                <h1>Reserve sua mesa - Negoney's Cafeterias</h1>
                <hr>
                <form id="forms">
                    <label for="nome">Seu Nome</label>
                    <br>
                    <input type="text" id="nome" placeholder="Ex: Negoney da silva">
                    <br>

                    <label for="qteqd">Quantas Pessoas e Quando</label>
                    <br>
                    <input type="text" id="qteqd" placeholder="Ex: 5 pessoas, dia 15/09/2026.">
                    <br>

                    <button type="submit">Reservar</button>
                </form>
                <section id="sect-msg"> 
                    <p id="msg">The Mr. NegoNey, dono da cafeteria, falou para você preencher todos os campos</p>
                </section>
                <section id="sect-reservas">
                    <h2 id="listaRes">Reservas reservadas:</h2>

                    <ul id="lista" class="lista"></ul>
                </section>
            </section>
        </main>
        <footer>
            <p class="copyright">&copy; Negoney's Cafeterias - Cafeteria do Mr. Negoney da Silva</p>
        </footer>
    </body>
</html>
